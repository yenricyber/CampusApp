<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 320" width="100%" height="100%">
  <defs>
    <!-- Text Arc for UNIVERSIDAD LATINO -->
    <path id="university-text-path" d="M 38,142 A 112,112 0 1,1 262,142" fill="none" />
    
    <!-- Sunburst Radial Gradient -->
    <radialGradient id="sunburst-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF59D" />
      <stop offset="60%" stop-color="#FDD835" />
      <stop offset="100%" stop-color="#FBC02D" />
    </radialGradient>

    <!-- Gold Edge Gradient -->
    <linearGradient id="gold-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#F57F17" />
      <stop offset="100%" stop-color="#FFD54F" />
    </linearGradient>

    <!-- Blue Ribbon Gradient -->
    <linearGradient id="ribbon-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142B68" />
      <stop offset="100%" stop-color="#0A1840" />
    </linearGradient>

    <!-- Laurel Leaf Definition -->
    <g id="leaf-pair">
      <path d="M 0,0 C -6,-10 -14,-14 -18,-11 C -20,-8 -12,2 0,0 Z" fill="#2E7D32" />
      <path d="M 0,0 C -4,-8 -10,-11 -13,-9 C -15,-6 -9,1 0,0 Z" fill="#43A047" opacity="0.6" />
      <path d="M 0,0 C 6,-10 14,-14 18,-11 C 20,-8 12,2 0,0 Z" fill="#2E7D32" />
      <path d="M 0,0 C 4,-8 10,-11 13,-9 C 15,-6 9,1 0,0 Z" fill="#4CAF50" opacity="0.6" />
    </g>
  </defs>

  <!-- Outer Ring Trim -->
  <circle cx="150" cy="132" r="126" fill="none" stroke="#0E2356" stroke-width="3" stroke-opacity="0.85" />

  <!-- White Disc Background for Circular Seal -->
  <circle cx="150" cy="132" r="124" fill="#FFFFFF" />

  <!-- Arched Text: UNIVERSIDAD LATINO -->
  <text fill="#0E2356" font-family="'Plus Jakarta Sans', 'Arial Black', Impact, sans-serif" font-weight="900" font-size="20.5" letter-spacing="2.2">
    <textPath href="#university-text-path" startOffset="50%" text-anchor="middle">
      UNIVERSIDAD LATINO
    </textPath>
  </text>

  <!-- Laurel Wreath (Hugging bottom half of circle) -->
  <g id="laurel-wreath">
    <!-- Left Laurel Branch -->
    <g transform="translate(150, 132)">
      <!-- Leaf pairs along left arc -->
      <g transform="rotate(-15) translate(0, 116) rotate(100)"><use href="#leaf-pair" transform="scale(0.85)" /></g>
      <g transform="rotate(-32) translate(0, 116) rotate(115)"><use href="#leaf-pair" transform="scale(0.9)" /></g>
      <g transform="rotate(-50) translate(0, 116) rotate(130)"><use href="#leaf-pair" transform="scale(0.95)" /></g>
      <g transform="rotate(-68) translate(0, 116) rotate(145)"><use href="#leaf-pair" transform="scale(1.0)" /></g>
      <g transform="rotate(-86) translate(0, 116) rotate(160)"><use href="#leaf-pair" transform="scale(1.0)" /></g>
      <g transform="rotate(-104) translate(0, 116) rotate(175)"><use href="#leaf-pair" transform="scale(0.95)" /></g>
      <g transform="rotate(-122) translate(0, 116) rotate(190)"><use href="#leaf-pair" transform="scale(0.9)" /></g>
      <g transform="rotate(-140) translate(0, 116) rotate(205)"><use href="#leaf-pair" transform="scale(0.8)" /></g>

      <!-- Leaf pairs along right arc -->
      <g transform="rotate(15) translate(0, 116) rotate(-100)"><use href="#leaf-pair" transform="scale(0.85)" /></g>
      <g transform="rotate(32) translate(0, 116) rotate(-115)"><use href="#leaf-pair" transform="scale(0.9)" /></g>
      <g transform="rotate(50) translate(0, 116) rotate(-130)"><use href="#leaf-pair" transform="scale(0.95)" /></g>
      <g transform="rotate(68) translate(0, 116) rotate(-145)"><use href="#leaf-pair" transform="scale(1.0)" /></g>
      <g transform="rotate(86) translate(0, 116) rotate(-160)"><use href="#leaf-pair" transform="scale(1.0)" /></g>
      <g transform="rotate(104) translate(0, 116) rotate(-175)"><use href="#leaf-pair" transform="scale(0.95)" /></g>
      <g transform="rotate(122) translate(0, 116) rotate(-190)"><use href="#leaf-pair" transform="scale(0.9)" /></g>
      <g transform="rotate(140) translate(0, 116) rotate(-205)"><use href="#leaf-pair" transform="scale(0.8)" /></g>
    </g>
  </g>

  <!-- Red Outer Ring of the Sunburst Disc -->
  <circle cx="150" cy="132" r="82" fill="#BA1A1A" stroke="#F57F17" stroke-width="2.5" />
  <circle cx="150" cy="132" r="74" fill="#BA1A1A" />

  <!-- Inner Sunburst Disc with Golden Radiant Rays -->
  <g id="sunburst">
    <circle cx="150" cy="132" r="72" fill="url(#sunburst-grad)" stroke="#F57F17" stroke-width="1.5" />
    
    <!-- 48 Radiant Sun Rays -->
    <g transform="translate(150, 132)" stroke="#F57F17" stroke-width="1.2" opacity="0.85">
      <!-- Radiating lines to disc edge -->
      <line x1="0" y1="0" x2="0" y2="-72" />
      <line x1="0" y1="0" x2="0" y2="72" />
      <line x1="0" y1="0" x2="-72" y2="0" />
      <line x1="0" y1="0" x2="72" y2="0" />
      
      <!-- Intermediate 7.5 deg rays -->
      <g transform="rotate(7.5)"><line x1="0" y1="0" x2="0" y2="-72" /><line x1="0" y1="0" x2="0" y2="72" /><line x1="0" y1="0" x2="-72" y2="0" /><line x1="0" y1="0" x2="72" y2="0" /></g>
      <g transform="rotate(15)"><line x1="0" y1="0" x2="0" y2="-72" /><line x1="0" y1="0" x2="0" y2="72" /><line x1="0" y1="0" x2="-72" y2="0" /><line x1="0" y1="0" x2="72" y2="0" /></g>
      <g transform="rotate(22.5)"><line x1="0" y1="0" x2="0" y2="-72" /><line x1="0" y1="0" x2="0" y2="72" /><line x1="0" y1="0" x2="-72" y2="0" /><line x1="0" y1="0" x2="72" y2="0" /></g>
      <g transform="rotate(30)"><line x1="0" y1="0" x2="0" y2="-72" /><line x1="0" y1="0" x2="0" y2="72" /><line x1="0" y1="0" x2="-72" y2="0" /><line x1="0" y1="0" x2="72" y2="0" /></g>
      <g transform="rotate(37.5)"><line x1="0" y1="0" x2="0" y2="-72" /><line x1="0" y1="0" x2="0" y2="72" /><line x1="0" y1="0" x2="-72" y2="0" /><line x1="0" y1="0" x2="72" y2="0" /></g>
      <g transform="rotate(45)"><line x1="0" y1="0" x2="0" y2="-72" /><line x1="0" y1="0" x2="0" y2="72" /><line x1="0" y1="0" x2="-72" y2="0" /><line x1="0" y1="0" x2="72" y2="0" /></g>
      <g transform="rotate(52.5)"><line x1="0" y1="0" x2="0" y2="-72" /><line x1="0" y1="0" x2="0" y2="72" /><line x1="0" y1="0" x2="-72" y2="0" /><line x1="0" y1="0" x2="72" y2="0" /></g>
      <g transform="rotate(60)"><line x1="0" y1="0" x2="0" y2="-72" /><line x1="0" y1="0" x2="0" y2="72" /><line x1="0" y1="0" x2="-72" y2="0" /><line x1="0" y1="0" x2="72" y2="0" /></g>
      <g transform="rotate(67.5)"><line x1="0" y1="0" x2="0" y2="-72" /><line x1="0" y1="0" x2="0" y2="72" /><line x1="0" y1="0" x2="-72" y2="0" /><line x1="0" y1="0" x2="72" y2="0" /></g>
      <g transform="rotate(75)"><line x1="0" y1="0" x2="0" y2="-72" /><line x1="0" y1="0" x2="0" y2="72" /><line x1="0" y1="0" x2="-72" y2="0" /><line x1="0" y1="0" x2="72" y2="0" /></g>
      <g transform="rotate(82.5)"><line x1="0" y1="0" x2="0" y2="-72" /><line x1="0" y1="0" x2="0" y2="72" /><line x1="0" y1="0" x2="-72" y2="0" /><line x1="0" y1="0" x2="72" y2="0" /></g>
    </g>
  </g>

  <!-- Central "UL" Monogram -->
  <g id="ul-monogram" transform="translate(150, 134)" fill="#0C2050">
    <!-- Letter 'U' -->
    <path d="
      M -32,-38
      L -19,-38
      L -19,-33
      L -23,-33
      L -23,0
      C -23,16 -12,24 0,24
      C 12,24 23,16 23,0
      L 23,-33
      L 19,-33
      L 19,-38
      L 32,-38
      L 32,-33
      L 28,-33
      L 28,1
      C 28,21 14,32 0,32
      C -14,32 -28,21 -28,1
      L -28,-33
      L -32,-33
      Z
    " />

    <!-- Letter 'L' (Interlocking through the right arm of 'U') -->
    <path d="
      M 4,-26
      L 17,-26
      L 17,-21
      L 13,-21
      L 13,18
      L 36,18
      L 39,12
      L 41,12
      L 40,25
      L 5,25
      L 5,20
      L 9,20
      L 9,-21
      L 4,-21
      Z
    " />
  </g>

  <!-- Bottom Ribbon / Banner -->
  <g id="bottom-ribbon">
    <!-- Left Ribbon Tail (Swallowtail fold) -->
    <path d="
      M 32,260 
      L 4,260 
      L 18,272 
      L 4,284 
      L 32,284 
      L 32,274 
      Z
    " fill="#0A1840" />
    <!-- Left Ribbon Fold Shadow -->
    <polygon points="32,284 45,284 32,295" fill="#050C22" />

    <!-- Right Ribbon Tail (Swallowtail fold) -->
    <path d="
      M 268,260 
      L 296,260 
      L 282,272 
      L 296,284 
      L 268,284 
      L 268,274 
      Z
    " fill="#0A1840" />
    <!-- Right Ribbon Fold Shadow -->
    <polygon points="268,284 255,284 268,295" fill="#050C22" />

    <!-- Main Center Ribbon Body -->
    <rect x="26" y="250" width="248" height="34" rx="2" fill="url(#ribbon-blue)" stroke="#3B5998" stroke-width="1" />
    
    <!-- White Inner Border Trim on Ribbon -->
    <rect x="29" y="253" width="242" height="28" rx="1" fill="none" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.3" />

    <!-- Motto Text: Unitus pro excellentia -->
    <text x="150" y="273" fill="#FFFFFF" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="14" text-anchor="middle" letter-spacing="0.8">
      Unitus pro excellentia
    </text>
  </g>
</svg>
